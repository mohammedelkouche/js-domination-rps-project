<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Rock, Paper, Scissors!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Rock, Paper, Scissors!</h1>
        <div class="hands" aria-hidden="true">✊ ✋ ✌️</div>
        <p>Challenge the computer! It has no hands, which feels like cheating.</p>
        <p>First to 3 points wins. Prepare your most dramatic rock pose.</p>
        <button type="button" onclick="game()">Let’s get handsy!</button>
    </main>
</body>
</html>
