<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="script.js" defer></script>
    <title>Rock, Paper, Scissors!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Rock, Paper, Scissors!</h1>
        <!-- <div class="hands" aria-hidden="true">✊ ✋ ✌️</div> -->
        <p>Challenge the computer!<br />It has no hands, which feels like cheating.</p>
        <p>First to 5 points wins. Prepare your most dramatic rock pose.</p>
        
        <div id="score">Player: 0 | Computer: 0</div>
        
        <div class="button-container">
            <button type="button" class="choice-button" onclick="handlePlayerSelection('rock')" disabled>✊ Rock</button>
            <button type="button" class="choice-button" onclick="handlePlayerSelection('paper')" disabled>✋ Paper</button>
            <button type="button" class="choice-button" onclick="handlePlayerSelection('scissors')" disabled>✌️ Scissors</button>
        </div>
        
        <button type="button" id="start-button" onclick="startGame()">Let's get handsy!</button>
        
        <div id="results"></div>
    </main>
</body>
</html>
